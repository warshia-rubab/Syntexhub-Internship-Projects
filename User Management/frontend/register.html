<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | User Management</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Left Panel - Branding -->
            <div class="auth-brand">
                <div class="brand-content">
                    <div class="brand-logo">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h1>Create Account</h1>
                    <p>Join us and start managing your users efficiently</p>
                </div>
            </div>

            <!-- Right Panel - Register Form -->
            <div class="auth-form">
                <div class="form-header">
                    <h2>SIGN UP</h2>
                    <p class="form-subtitle">Create your account to get started</p>
                </div>

                <form id="registerForm" class="auth-form-fields">
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="regFirstName">
                                <i class="fas fa-user"></i>
                                First Name
                            </label>
                            <input
                                type="text"
                                id="regFirstName"
                                placeholder="John"
                                required
                            />
                        </div>

                        <div class="form-group half">
                            <label for="regLastName">
                                <i class="fas fa-user"></i>
                                Last Name
                            </label>
                            <input
                                type="text"
                                id="regLastName"
                                placeholder="Doe"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <input
                            type="email"
                            id="regEmail"
                            placeholder="Enter your email"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="regPassword">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="regPassword"
                                placeholder="Create a password"
                                required
                            />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- ✅ CONFIRM PASSWORD FIELD -->
                    <div class="form-group">
                        <label for="regConfirmPassword">
                            <i class="fas fa-check-circle"></i>
                            Confirm Password
                        </label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="regConfirmPassword"
                                placeholder="Re-enter your password"
                                required
                            />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- ✅ PASSWORD STRENGTH INDICATOR -->
                    <div class="password-strength">
                        <p class="strength-title">Password must contain:</p>
                        <ul class="strength-list">
                            <li id="lengthCheck">
                                <i class="fas fa-circle"></i>
                                At least 6 characters
                            </li>
                            <li id="uppercaseCheck">
                                <i class="fas fa-circle"></i>
                                One uppercase letter
                            </li>
                            <li id="numberCheck">
                                <i class="fas fa-circle"></i>
                                One number
                            </li>
                        </ul>
                        <div class="strength-bar">
                            <div id="strengthBar" class="strength-level"></div>
                        </div>
                        <p id="strengthText" class="strength-text">Weak</p>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Create Account</span>
                        <i class="fas fa-user-plus"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>
                        Already have an account?
                        <a href="index.html">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS -->
    <!-- ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
