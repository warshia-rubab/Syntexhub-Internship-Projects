<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - ShopHub</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand">Shop<span>Hub</span></a>
  <ul class="navbar-links">
    <li><a href="/index.html">Home</a></li>
    <li><a href="/pages/home.html">Products</a></li>
    <li><a href="/pages/orders.html">Orders</a></li>
    <li><a href="/pages/about.html">About</a></li>
  </ul>
  <div id="navbarActions" class="navbar-actions"></div>
</nav>

<section class="page container">
  <div class="page-header">
    <h1 class="page-title">Shopping Cart</h1>
    <p class="page-subtitle">Review items before checkout</p>
  </div>

  <div class="grid" style="grid-template-columns:2fr 1fr;gap:32px">
    <div id="cartItems"></div>

    <aside class="card" style="height:fit-content;position:sticky;top:100px">
      <h3 style="font-size:20px;font-weight:800;margin-bottom:20px">Order Summary</h3>
      <div class="flex-between mb-3">
        <span style="color:var(--text-muted)">Subtotal</span>
        <span style="font-weight:700" id="cartSubtotal">$0.00</span>
      </div>
      <div class="flex-between mb-3">
        <span style="color:var(--text-muted)">Shipping</span>
        <span style="font-weight:700;color:var(--accent)">FREE</span>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:16px;margin-bottom:20px" class="flex-between">
        <span style="font-weight:700">Total</span>
        <span style="font-size:28px;font-weight:800;color:var(--accent)" id="cartTotal">$0.00</span>
      </div>
      <a href="/pages/checkout.html" class="btn btn-primary btn-block btn-lg">Proceed to Checkout</a>
      <a href="/pages/home.html" class="btn btn-outline btn-block mt-2">Continue Shopping</a>
    </aside>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© 2026 ShopHub. All rights reserved.</div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (!requireAuth()) return;
    renderCart();
  });
</script>
</body>
</html>
