<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - ShopHub</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand">Shop<span>Hub</span></a>
  <ul class="navbar-links">
    <li><a href="/index.html">Home</a></li>
    <li><a href="/pages/home.html" class="active">Products</a></li>
    <li><a href="/pages/orders.html">Orders</a></li>
    <li><a href="/pages/about.html">About</a></li>
  </ul>
  <div id="navbarActions" class="navbar-actions"></div>
</nav>

<section class="page container">
  <div class="page-header">
    <h1 class="page-title">All Products</h1>
    <p class="page-subtitle">Browse our complete catalogue</p>
  </div>

  <div id="categoryTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px"></div>

  <div class="card mb-4" style="padding:16px">
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end">
      <div class="form-group" style="margin:0">
        <label class="form-label">Search</label>
        <input type="text" id="searchInput" class="form-input" placeholder="Search products...">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Min Price</label>
        <input type="number" id="minPrice" class="form-input" placeholder="$0" min="0">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Max Price</label>
        <input type="number" id="maxPrice" class="form-input" placeholder="$9999" min="0">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Sort By</label>
        <select id="sortSelect" class="form-select">
          <option value="default">Default</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="name_asc">Name: A-Z</option>
          <option value="name_desc">Name: Z-A</option>
        </select>
      </div>
      <button id="clearFilters" class="btn btn-outline" style="padding:12px 18px">Clear</button>
    </div>
  </div>

  <div class="grid grid-3 stagger" id="productsGrid">
    <div class="spinner"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© 2026 ShopHub. All rights reserved.</div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/categories.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/products.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (!requireAuth()) return;
  });
</script>
</body>
</html>
