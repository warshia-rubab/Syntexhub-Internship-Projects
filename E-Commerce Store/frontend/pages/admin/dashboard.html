<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - ShopHub</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand">Shop<span>Hub</span> Admin</a>
  <ul class="navbar-links">
    <li><a href="/pages/admin/dashboard.html" class="active">Dashboard</a></li>
    <li><a href="/pages/home.html">Store</a></li>
  </ul>
  <div class="navbar-actions">
    <button class="btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
    <span id="userName" style="color:var(--text-muted);font-size:14px"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<section class="page container">
  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Real-time store metrics</p>
  </div>

  <div class="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:32px">
    <div class="stat-card" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--primary-light);color:var(--primary);flex-shrink:0">👥</div>
      <div>
        <div style="font-size:28px;font-weight:800;color:var(--text)" id="statUsers">–</div>
        <div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Users</div>
      </div>
    </div>
    <div class="stat-card" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(16,185,129,0.15);color:var(--accent);flex-shrink:0">📦</div>
      <div>
        <div style="font-size:28px;font-weight:800;color:var(--text)" id="statProducts">–</div>
        <div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Products</div>
      </div>
    </div>
    <div class="stat-card" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(245,158,11,0.15);color:var(--warning);flex-shrink:0">🛒</div>
      <div>
        <div style="font-size:28px;font-weight:800;color:var(--text)" id="statOrders">–</div>
        <div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Orders</div>
      </div>
    </div>
    <div class="stat-card" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(239,68,68,0.15);color:var(--danger);flex-shrink:0">💰</div>
      <div>
        <div style="font-size:28px;font-weight:800;color:var(--text)" id="statRevenue">–</div>
        <div style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Revenue</div>
      </div>
    </div>
  </div>

  <div class="card mb-4" style="padding:24px">
    <h3 style="font-size:18px;font-weight:700;margin-bottom:20px;color:var(--text)">📈 Sales Trend</h3>
    <div style="height:320px;position:relative">
      <canvas id="salesChart"></canvas>
      <div id="chartEmpty" style="display:none;text-align:center;padding:80px 20px;color:var(--text-muted)">
        <p>No sales data yet. Place your first order to see it here.</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:18px;font-weight:700;margin-bottom:20px;color:var(--text)">🔍 Recent Activity</h3>
    <div id="activityLogs"><div class="spinner"></div></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© 2026 ShopHub — Admin Panel</div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var u = getCurrentUser();
    if (u) { var el = document.getElementById("userName"); if (el) el.textContent = u.name; }
    loadDashboard();
  });
</script>
</body>
</html>
