<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - ShopHub</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="navbar-brand">Shop<span>Hub</span></a>
  <ul class="navbar-links">
    <li><a href="/index.html">Home</a></li>
    <li><a href="/pages/home.html">Products</a></li>
    <li><a href="/pages/orders.html">Orders</a></li>
    <li><a href="/pages/about.html">About</a></li>
  </ul>
  <div id="navbarActions" class="navbar-actions"></div>
</nav>

<section class="page container">
  <div class="page-header">
    <h1 class="page-title">Checkout</h1>
    <p class="page-subtitle">Review and confirm your order</p>
  </div>

  <div class="grid" style="grid-template-columns:2fr 1fr;gap:32px">
    <div class="card">
      <h3 style="margin-bottom:20px;font-size:20px">Shipping Information</h3>
      <form id="checkoutForm">
        <div class="grid grid-2" style="gap:16px">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="shipName" class="form-input" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input type="email" id="shipEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone *</label>
            <input type="tel" id="shipPhone" class="form-input" placeholder="+92 300 1234567" required>
          </div>
          <div class="form-group">
            <label class="form-label">City *</label>
            <input type="text" id="shipCity" class="form-input" placeholder="Karachi" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Delivery Address *</label>
          <input type="text" id="shipAddress" class="form-input" placeholder="123 Main Street, Area" required>
        </div>
        <div class="grid grid-2" style="gap:16px">
          <div class="form-group">
            <label class="form-label">Postal Code</label>
            <input type="text" id="shipPostal" class="form-input" placeholder="75500">
          </div>
          <div class="form-group">
            <label class="form-label">Payment Method</label>
            <select id="payMethod" class="form-select">
              <option value="cod">Cash on Delivery</option>
              <option value="card">Card (Demo)</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <aside class="card" style="height:fit-content;position:sticky;top:100px">
      <h3 style="margin-bottom:20px;font-size:20px">Order Summary</h3>
      <div id="checkoutItems" class="mb-3"></div>
      <div style="border-top:1px solid var(--border);padding-top:16px" class="flex-between mb-3">
        <span style="font-weight:600">Total</span>
        <span style="font-size:24px;font-weight:800;color:var(--accent)" id="checkoutTotal">$0.00</span>
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="placeOrderBtn" onclick="placeOrder()">
        Confirm Order
      </button>
      <a href="/pages/cart.html" class="btn btn-outline btn-block mt-2">Back to Cart</a>
    </aside>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© 2026 ShopHub. All rights reserved.</div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/orders.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (!requireAuth()) return;
    renderCheckout();
    var u = getCurrentUser();
    if (u) {
      var nameEl = document.getElementById("shipName");
      var emailEl = document.getElementById("shipEmail");
      if (nameEl && u.name) nameEl.value = u.name;
      if (emailEl && u.email) emailEl.value = u.email;
    }
  });
</script>
</body>
</html>
